name: Build Android APK

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CalculadoraWiFi.apk || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CalculadoraWiFi-APK
        path: app/build/outputs/apk/debug/CalculadoraWiFi.apk
        retention-days: 30

    - name: Create Release Info
      run: |
        echo "# 📱 Calculadora WiFi - Build Info" > release-info.txt
        echo "" >> release-info.txt
        echo "Build Date: $(date)" >> release-info.txt
        echo "Commit: ${{ github.sha }}" >> release-info.txt
        echo "Branch: ${{ github.ref_name }}" >> release-info.txt
        echo "" >> release-info.txt
        echo "## 📥 Instalación" >> release-info.txt
        echo "1. Descarga el archivo APK" >> release-info.txt
        echo "2. Habilita 'Instalar desde fuentes desconocidas' en tu Android" >> release-info.txt
        echo "3. Instala el APK" >> release-info.txt
        echo "4. ¡Disfruta del truco de cartas WiFi!" >> release-info.txt

    - name: Upload Build Info
      uses: actions/upload-artifact@v4
      with:
        name: Build-Info
        path: release-info.txt
