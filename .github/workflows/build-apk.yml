name: Build Android APK

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      continue-on-error: true

    - name: Rename unsigned APK
      if: steps.sign_app.outcome == 'failure'
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/CalculadoraWiFi-unsigned.apk || true
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CalculadoraWiFi.apk || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CalculadoraWiFi-APK
        path: |
          app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release Info
      run: |
        echo "# 📱 Calculadora WiFi - Build Info" > release-info.txt
        echo "" >> release-info.txt
        echo "Build Date: $(date)" >> release-info.txt
        echo "Commit: ${{ github.sha }}" >> release-info.txt
        echo "Branch: ${{ github.ref_name }}" >> release-info.txt
        echo "" >> release-info.txt
        echo "## 📥 Instalación" >> release-info.txt
        echo "1. Descarga el archivo APK" >> release-info.txt
        echo "2. Habilita 'Instalar desde fuentes desconocidas' en tu Android" >> release-info.txt
        echo "3. Instala el APK" >> release-info.txt
        echo "4. ¡Disfruta del truco de cartas WiFi!" >> release-info.txt

    - name: Upload Build Info
      uses: actions/upload-artifact@v4
      with:
        name: Build-Info
        path: release-info.txt
